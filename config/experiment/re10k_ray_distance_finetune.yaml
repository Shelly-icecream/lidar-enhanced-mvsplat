# @package _global_

defaults:
  - override /dataset: re10k
  - override /model/encoder: costvolume
  - override /loss: [mse, lpips]

wandb:
  name: re10k_ray_distance_finetune
  tags: [re10k, 256x256, ray_distance, finetune]

data_loader:
  train:
    batch_size: 2

trainer:
  max_steps: 20_000
  accumulate_grad_batches: 4

optimizer:
  lr: 5.0e-5
  warm_up_steps: 500
  cosine_lr: true

checkpointing:
  load: checkpoints/re10k.ckpt
  resume: false
  every_n_train_steps: 5_000
  save_top_k: -1

model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1, 1, 1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1, 1, 1, 1, 1]

    # The full RE10K checkpoint is loaded below after model construction, so
    # loading the standalone UniMatch initialization here would be redundant.
    unimatch_weights_path: null

    use_lidar_bias: false
    use_lidar_cross_attention: false
    lidar_cross_attention_inference_mode: "off"
    use_lidar_gaussian_adapter: false

    frozen_params:
      - backbone

loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

dataset:
  image_shape: [256, 256]
  roots: [datasets/re10k]
  near: 1.0
  far: 100.0
  baseline_scale_bounds: false
  make_baseline_1: false

train:
  depth_mode: null
  extended_visualization: false
  print_log_every_n_steps: 50

test:
  eval_time_skip_steps: 5
  compute_scores: true
