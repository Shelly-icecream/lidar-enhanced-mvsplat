# @package _global_
defaults:
  - override /dataset: nuscenes
  - override /model/encoder: costvolume
  # Keep a typed-config placeholder. Adapter-loss mode skips this global loss.
  - override /loss: [mse]

wandb:
  name: nuscenes_lidar_bias
  tags: [nuscenes, lidar_bias, lidar_refine]
  mode: online
  entity: asdf5689-wuhan-university

data_loader:
  train:
    batch_size: 2
    num_workers: 0
    persistent_workers: false   
  test:
    batch_size: 1
    num_workers: 0
    persistent_workers: false   
  val:
    batch_size: 1               
    num_workers: 0              
    persistent_workers: false   

trainer:
  max_steps: 2000
  limit_val_batches: 0
  num_sanity_val_steps: 0
  gradient_clip_val: 0.5        

# ----- model params -----
model:
  encoder:
    use_lidar_bias: true

    use_lidar_gaussian_neighbor_depth_adapter: true
    use_lidar_gaussian_neighbor_depth_loss: true
    lidar_neighbor_depth_radius: 4
    lidar_neighbor_depth_topk: 20
    lidar_neighbor_depth_max_relative_ref_disparity_error: 0.05
    lidar_neighbor_depth_reference_bound_margin: 0.02
    lidar_neighbor_depth_min_shallow_cosine: 0.85
    lidar_neighbor_depth_min_refine_cosine: 0.9
    lidar_neighbor_depth_max_rgb_difference: 0.12
    lidar_neighbor_depth_max_gate: 1.0
    lidar_neighbor_depth_target_disagreement_scale: 0.2
    lidar_neighbor_depth_local_rgb_weight: 0.1
    lidar_neighbor_depth_improvement_weight: 1.0
    lidar_neighbor_depth_coverage_weight: 1.0
    lidar_neighbor_depth_over_alpha_worse_weight: 0.5
    lidar_neighbor_depth_alpha_tolerance: 0.02
    lidar_neighbor_depth_min_attraction: 0.4
    lidar_neighbor_depth_attraction_weight: 1.0
    lidar_neighbor_depth_diagnostic_every_n_steps: 100

    use_lidar_gaussian_adapter: false
    use_lidar_gaussian_adapter_loss: false
    lidar_gaussian_edit_xy: false
    lidar_gaussian_edit_scale: false
    lidar_gaussian_edit_rotation: false
    lidar_gaussian_edit_sh_dc: true
    lidar_gaussian_edit_sh_rest: false
    lidar_gaussian_edit_opacity: true
    lidar_gaussian_opacity_max_delta_logit: 1.0
    lidar_gaussian_adapter_local_rgb_weight: 1.0
    lidar_gaussian_adapter_improvement_weight: 1.0
    lidar_gaussian_adapter_improvement_margin: 0.0
    lidar_gaussian_adapter_alpha_weight: 0.1
    lidar_gaussian_context_render_weight: 0.0

    frozen_params: 
      - backbone
      - depth_predictor.corr_refine_net
      - depth_predictor.regressor_residual
      - depth_predictor.depth_head_lowres
      - depth_predictor.upsampler
      - depth_predictor.proj_feature
      - depth_predictor.refine_unet
      - depth_predictor.to_disparity
      - depth_predictor.to_gaussians
    lidar_gaussian_gate_kernel: 5
    lidar_lambda_surface: 10.0
    lidar_lambda_free: 2.0
    lidar_sigma_disp: 0.01
    lidar_free_margin: 0.5
    lidar_temperature: 5.0
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1, 1, 1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1, 1, 1, 1, 1]
    unimatch_weights_path: null

# ----- optimizer / lr -----
optimizer:
  lr: 1.0e-4
  warm_up_steps: 500            
  cosine_lr: true               

# ----- dataset -----
dataset:
  image_shape: [176, 320]
  root: datasets/nuscenes
  version: v1.0-mini

  near: 1.0
  far: 80.0

  augment: false
  skip_bad_shape: true
  cameras_are_circular: false
  overfit_to_scene: null
  max_fov: 120.0
  use_keyframe_only: true

  camera_name: CAM_FRONT
  num_context_views: 2
  num_target_views: 1
  frame_stride: 1
  save_dynamic_diagnostics: true
  dynamic_diagnostics_dir: outputs/dynamic_diagnostics

train:
  depth_mode: null              
  extended_visualization: false 
  print_log_every_n_steps: 50   

test:
  output_path: outputs/test     
  eval_time_skip_steps: 5
  compute_scores: true
  save_image: true
  save_video: false
  save_lidar_alpha_diagnostics: false

checkpointing:
  load: checkpoints/re10k.ckpt
  resume: false                           
  every_n_train_steps: 200              
  save_top_k: -1                          
  pretrained_model: null
