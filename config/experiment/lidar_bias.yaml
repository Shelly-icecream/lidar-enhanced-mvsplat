# @package _global_
defaults:
  - override /dataset: nuscenes
  - override /model/encoder: costvolume
  - override /loss: [mse, lpips]

wandb:
  name: nuscenes_lidar_bias
  tags: [nuscenes, lidar_bias, lidar_refine]

data_loader:
  train:
    batch_size: 2
    num_workers: 0
    persistent_workers: false   
  test:
    batch_size: 1
    num_workers: 0
    persistent_workers: false   
  val:
    batch_size: 1               
    num_workers: 0              
    persistent_workers: false   

trainer:
  max_steps: 400
  limit_val_batches: 0
  num_sanity_val_steps: 0
  gradient_clip_val: 0.5        

# ----- model params -----
model:
  encoder:
    use_lidar_cross_attention: false
    lidar_cross_attention_inference_mode: "off"
    lidar_cross_attention_dim: 128
    lidar_cross_attention_heads: 4
    use_lidar_refine_loss: false
    use_lidar_world_mean_anchor: true
    lidar_world_anchor_rescale_covariance: true
    lidar_world_anchor_scale_ratio_min: 0.5
    lidar_world_anchor_scale_ratio_max: 2.0
    use_lidar_post_gaussian_adapter: true
    lidar_post_gaussian_adapter_hidden_dim: 128
    lidar_post_gaussian_attention_heads: 4
    lidar_post_gaussian_window_size: 5
    lidar_post_gaussian_max_scale_factor: 2.0
    lidar_post_gaussian_max_rotation_degrees: 10.0
    lidar_post_gaussian_max_sh_residual: 0.03
    frozen_params: 
      - backbone
      - depth_predictor.corr_refine_net
      - depth_predictor.regressor_residual
      - depth_predictor.depth_head_lowres
      - depth_predictor.upsampler
      - depth_predictor.proj_feature
      - depth_predictor.refine_unet
      - depth_predictor.to_disparity
      - depth_predictor.to_gaussians
    lidar_final_loss_weight: 0.0
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1, 1, 1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1, 1, 1, 1, 1]
    unimatch_weights_path: null

# ----- optimizer / lr -----
optimizer:
  lr: 1.0e-4
  warm_up_steps: 500            
  cosine_lr: true               

# ----- losses -----
loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

# ----- dataset -----
dataset:
  image_shape: [176, 320]
  root: datasets/nuscenes
  version: v1.0-mini

  near: 1.0
  far: 80.0

  augment: false
  skip_bad_shape: true
  cameras_are_circular: false
  overfit_to_scene: null
  max_fov: 120.0
  use_keyframe_only: true

  camera_name: CAM_FRONT
  num_context_views: 2
  num_target_views: 1
  frame_stride: 1

train:
  depth_mode: null              
  extended_visualization: false 
  print_log_every_n_steps: 50   

test:
  output_path: outputs/test     
  eval_time_skip_steps: 5
  compute_scores: true
  save_image: true
  save_video: false

checkpointing:
  load: checkpoints/re10k.ckpt   
  resume: false                           
  every_n_train_steps: 200              
  save_top_k: -1                          
  pretrained_model: null
