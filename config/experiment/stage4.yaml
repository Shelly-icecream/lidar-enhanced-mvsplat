# @package _global_
defaults:
  - override /dataset: nuscenes
  - override /model/encoder: costvolume
  - override /loss: [mse, lpips, cross_visual_depth, lidar_inverse_depth, context_rgb]

wandb:
  name: baseline
  tags: [nuscenes, re10k, visual_only, baseline]
  mode: disabled

data_loader:
  train:
    batch_size: 2
    num_workers: 0
    persistent_workers: false
  test:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
  val:
    batch_size: 1
    num_workers: 0
    persistent_workers: false

trainer:
  max_steps: 2000
  limit_val_batches: 0
  num_sanity_val_steps: 0
  gradient_clip_val: 0.5

# ----- model params -----
model:
  encoder:
    use_lidar_bias_train: true
    use_lidar_bias_test: true

    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1, 1, 1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1, 1, 1, 1, 1]
    unimatch_weights_path: null

    frozen_params: []

loss:
  # 深度约束
  lidar_inverse_depth: # 很重要，要不然深度会退化
    weight: 1.0
    beta: 0.01
  cross_visual_depth:
    print_every_n_steps: 50
    color_threshold: 0.1
    weight: 1.0
    beta: 0.01
    reprojection_threshold_px: 5.0
    relative_depth_threshold: 0.20
  
  # 结构约束
  lpips:
    apply_after_step: 0
    weight: 0.05

  # 完整的两个 context 高斯合并后渲染回 context，仅 loss 排除各自动态区域
  context_rgb:
    weight: 1.0

# ----- optimizer / lr -----
optimizer:
  lr: 1.0e-4
  warm_up_steps: 500
  cosine_lr: true

# ----- dataset -----
dataset:
  load_lidar_depth: true

  image_shape: [176, 320]
  root: datasets/nuscenes
  version: v1.0-mini

  near: 1.0
  far: 80.0

  augment: false
  skip_bad_shape: true
  cameras_are_circular: false
  overfit_to_scene: null
  max_fov: 120.0
  use_keyframe_only: true

  camera_names: 
    - CAM_FRONT
  num_context_views: 2
  num_target_views: 1
  frame_stride: 1

train:
  depth_mode: null
  extended_visualization: false
  print_log_every_n_steps: 50

test:
  output_path: outputs/test
  eval_time_skip_steps: 5
  compute_scores: true
  save_image: true
  save_video: false
  save_lidar_alpha_diagnostics: false

checkpointing:
  load: checkpoints/re10k.ckpt
  resume: false
  every_n_train_steps: 200
  save_top_k: -1
  pretrained_model: null