name: costvolume

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_depth_candidates: 32
num_surfaces: 1

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

# params for multi-view depth predictor
unimatch_weights_path: "checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth"
multiview_trans_attn_split: 2
costvolume_unet_feat_dim: 128
costvolume_unet_channel_mult: [1,1,1]
costvolume_unet_attn_res: []
depth_unet_feat_dim: 64
depth_unet_attn_res: []
depth_unet_channel_mult: [1, 1, 1]
downscale_factor: 4
shim_patch_size: 4

# below are ablation settings, keep them as false for default model
wo_depth_refine: false         # Table 3: base
wo_cost_volume: false          # Table 3: w/o cost volume
wo_backbone_cross_attn: false  # Table 3: w/o cross-view attention
wo_cost_volume_refine: false   # Table 3: w/o U-Net
use_epipolar_trans: false      # Table B: w/ Epipolar Transformer

# LiDAR guidance
use_lidar_refine_loss: false
use_lidar_world_mean_anchor: false
lidar_world_anchor_rescale_covariance: true
lidar_world_anchor_scale_ratio_min: 0.5
lidar_world_anchor_scale_ratio_max: 2.0
use_lidar_post_gaussian_adapter: false
lidar_post_gaussian_adapter_hidden_dim: 128
lidar_post_gaussian_attention_heads: 4
lidar_post_gaussian_window_size: 5
lidar_post_gaussian_max_scale_factor: 2.0
lidar_post_gaussian_max_rotation_degrees: 10.0
lidar_post_gaussian_max_sh_residual: 0.03
frozen_params: []
lidar_final_loss_weight: 0.01
use_lidar_cross_attention: false
lidar_cross_attention_dim: 128
lidar_cross_attention_heads: 4
lidar_cross_attention_radius: 4
lidar_cross_attention_max_delta_logit: 15.0
# Inference-only checkpoint override: auto | on | off.
lidar_cross_attention_inference_mode: auto
