name: costvolume

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_depth_candidates: 32
num_surfaces: 1

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

# params for multi-view depth predictor
unimatch_weights_path: "checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth"
multiview_trans_attn_split: 2
costvolume_unet_feat_dim: 128
costvolume_unet_channel_mult: [1,1,1]
costvolume_unet_attn_res: []
depth_unet_feat_dim: 64
depth_unet_attn_res: []
depth_unet_channel_mult: [1, 1, 1]
downscale_factor: 4
shim_patch_size: 4

# below are ablation settings, keep them as false for default model
wo_depth_refine: false         # Table 3: base
wo_cost_volume: false          # Table 3: w/o cost volume
wo_backbone_cross_attn: false  # Table 3: w/o cross-view attention
wo_cost_volume_refine: false   # Table 3: w/o U-Net
use_epipolar_trans: false      # Table B: w/ Epipolar Transformer

# LiDAR guidance
use_lidar_bias: false
use_lidar_gaussian_adapter: false
lidar_gaussian_edit_xy: true
lidar_gaussian_edit_scale: true
lidar_gaussian_edit_rotation: true
lidar_gaussian_edit_sh_dc: false
lidar_gaussian_edit_sh_rest: false
lidar_gaussian_edit_opacity: false
lidar_gaussian_opacity_max_delta_logit: 1.0
use_lidar_gaussian_adapter_loss: false
lidar_gaussian_adapter_local_rgb_weight: 1.0
lidar_gaussian_adapter_improvement_weight: 1.0
lidar_gaussian_adapter_improvement_margin: 0.0
lidar_gaussian_adapter_alpha_weight: 0.1
lidar_gaussian_context_render_weight: 0.0
use_lidar_gaussian_neighbor_depth_adapter: false
use_lidar_gaussian_neighbor_depth_loss: false
lidar_neighbor_depth_radius: 2
lidar_neighbor_depth_topk: 4
lidar_neighbor_depth_min_neighbors_before_gap: 4
lidar_neighbor_depth_min_log_score_gap: 0.4
lidar_neighbor_depth_max_relative_ref_disparity_error: 0.05
lidar_neighbor_depth_reference_bound_margin: 0.02
lidar_neighbor_depth_min_shallow_cosine: 0.85
lidar_neighbor_depth_min_refine_cosine: 0.9
lidar_neighbor_depth_max_rgb_difference: 0.12
lidar_neighbor_depth_max_gate: 0.3
lidar_neighbor_depth_target_disagreement_scale: 0.2
lidar_neighbor_depth_local_rgb_weight: 1.0
lidar_neighbor_depth_improvement_weight: 1.0
lidar_neighbor_depth_coverage_weight: 0.2
lidar_neighbor_depth_over_alpha_worse_weight: 0.5
lidar_neighbor_depth_alpha_tolerance: 0.02
lidar_neighbor_depth_min_attraction: 0.1
lidar_neighbor_depth_attraction_weight: 0.2
lidar_neighbor_depth_diagnostic_every_n_steps: 100
frozen_params: []
lidar_gaussian_gate_kernel: 5
# LiDAR visibility prior params
lidar_lambda_surface: 10.0
lidar_lambda_free: 2.0
lidar_sigma_disp: 0.12
lidar_free_margin: 0.5
lidar_temperature: 5.0
